<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Список справ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f2f4f8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 15px;
    }

    .app {
      width: 100%;
      max-width: 850px;
      background: #ffffff;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #222;
    }

    .top-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      background: #f5f7fb;
      border: 1px solid #dfe5f0;
      border-radius: 12px;
      padding: 14px;
    }

    .top-panel-text {
      color: #444;
      font-size: 14px;
    }

    .open-modal-btn,
    .modal-actions button,
    .task button,
    .tabs button,
    .clear-history {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .open-modal-btn,
    .save-task-btn {
      background: #2d6cdf;
      color: white;
    }

    .open-modal-btn:hover,
    .save-task-btn:hover {
      background: #1f55b5;
    }

    .cancel-modal-btn {
      background: #6c757d;
      color: white;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tabs button {
      flex: 1;
      background: #e8ecf3;
      color: #222;
    }

    .tabs button.active {
      background: #2d6cdf;
      color: #fff;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
      color: #444;
      font-size: 14px;
    }

    .stat-box {
      flex: 1;
      background: #f5f7fb;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
    }

    .legend {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .legend-item {
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #ddd;
    }

    .legend-safe {
      background: #e9f8ee;
    }

    .legend-warning {
      background: #fff7d6;
    }

    .legend-overdue {
      background: #ffd6d6;
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task {
      border-radius: 12px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border: 2px solid transparent;
    }

    .task.safe {
      background: #e9f8ee;
      border-color: #95d5a6;
    }

    .task.warning {
      background: #fff7d6;
      border-color: #f0d36b;
    }

    .task.overdue {
      background: #ffd6d6;
      border-color: #e05252;
    }

    .task.completed {
      background: #eef1f5;
      border-color: #c6ccd6;
    }

    .task-info {
      flex: 1;
    }

    .task-title {
      font-size: 16px;
      color: #222;
      margin-bottom: 5px;
      word-break: break-word;
    }

    .task-date,
    .task-deadline,
    .task-status,
    .task-description,
    .task-priority {
      font-size: 12px;
      color: #555;
      margin-top: 3px;
    }

    .task-status strong,
    .task-priority strong {
      color: #222;
    }

    .task-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .complete-btn {
      background: #28a745;
      color: #fff;
    }

    .edit-btn {
      background: #ffc107;
      color: #222;
    }

    .delete-btn {
      background: #dc3545;
      color: #fff;
    }

    .restore-btn {
      background: #17a2b8;
      color: #fff;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 25px 0;
    }

    .clear-history {
      margin-top: 20px;
      width: 100%;
      background: #dc3545;
      color: #fff;
      display: none;
    }

    .clear-history.visible {
      display: block;
    }

    .toast-container {
      position: fixed;
      right: 20px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1000;
    }

    .toast {
      min-width: 260px;
      max-width: 340px;
      background: #222;
      color: #fff;
      padding: 14px 16px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      font-size: 14px;
      animation: slideIn 0.3s ease;
    }

    .toast-title {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 15px;
      z-index: 900;
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      animation: modalShow 0.25s ease;
    }

    .modal h2 {
      font-size: 22px;
      color: #222;
      margin-bottom: 6px;
    }

    .modal-subtitle {
      font-size: 13px;
      color: #667085;
      margin-bottom: 18px;
    }

    .modal-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .modal-field label {
      font-size: 13px;
      font-weight: bold;
      color: #333;
    }

    .modal-field input,
    .modal-field select,
    .modal-field textarea {
      width: 100%;
      border: 1px solid #cfd6e4;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      resize: vertical;
    }

    .modal-field input:focus,
    .modal-field select:focus,
    .modal-field textarea:focus {
      border-color: #2d6cdf;
      box-shadow: 0 0 0 3px rgba(45, 108, 223, 0.15);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 6px;
    }

    @keyframes slideIn {
      from {
        transform: translateX(120%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @keyframes modalShow {
      from {
        transform: translateY(20px) scale(0.96);
        opacity: 0;
      }
      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    @media (max-width: 750px) {
      .top-panel {
        flex-direction: column;
        align-items: stretch;
      }

      .legend {
        grid-template-columns: 1fr;
      }

      .task {
        flex-direction: column;
        align-items: stretch;
      }

      .task-actions {
        justify-content: flex-start;
      }

      .stats {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <div class="modal-overlay" id="taskModal">
    <div class="modal">
      <h2 id="modalTitle">Нове завдання</h2>
      <p class="modal-subtitle">Налаштуйте завдання перед додаванням у список</p>

      <form class="modal-form" id="taskForm">
        <div class="modal-field">
          <label for="taskInput">Назва завдання</label>
          <input type="text" id="taskInput" placeholder="Наприклад: зробити лабораторну" />
        </div>

        <div class="modal-field">
          <label for="deadlineInput">Введіть час дедлайну</label>
          <input type="datetime-local" id="deadlineInput" />
        </div>

        <div class="modal-field">
          <label for="priorityInput">Важливість</label>
          <select id="priorityInput">
            <option value="Звичайна">Звичайна</option>
            <option value="Важлива">Важлива</option>
            <option value="Дуже важлива">Дуже важлива</option>
          </select>
        </div>

        <div class="modal-field">
          <label for="descriptionInput">Опис або примітка</label>
          <textarea id="descriptionInput" rows="3" placeholder="Можна залишити порожнім"></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="cancel-modal-btn" id="cancelEditBtn">Скасувати</button>
          <button type="submit" class="save-task-btn" id="submitBtn">Додати</button>
        </div>
      </form>
    </div>
  </div>

  <div class="app">
    <h1>Список справ</h1>

    <div class="top-panel">
      <div class="top-panel-text">Створюйте завдання, задавайте дедлайни та відстежуйте терміни виконання:</div>
      <button class="open-modal-btn" id="openCreateModalBtn" type="button">Створити завдання</button>
    </div>

    <div class="tabs">
      <button class="active" id="activeTab" type="button">Активні завдання</button>
      <button id="historyTab" type="button">Історія виконаних</button>
    </div>

    <div class="stats">
      <div class="stat-box">Усього: <span id="totalCount">0</span></div>
      <div class="stat-box">Активні: <span id="activeCount">0</span></div>
      <div class="stat-box">Виконані: <span id="completedCount">0</span></div>
    </div>

    <div class="legend">
      <div class="legend-item legend-safe">Зелений: більше 2 тижнів</div>
      <div class="legend-item legend-warning">Жовтий: залишився тиждень або менше</div>
      <div class="legend-item legend-overdue">Червоний: залишився день або прострочено</div>
    </div>

    <ul class="task-list" id="taskList"></ul>

    <button class="clear-history" id="clearHistoryBtn" type="button">Очистити історію</button>
  </div>

  <script>
    const taskModal = document.getElementById("taskModal");
    const openCreateModalBtn = document.getElementById("openCreateModalBtn");
    const modalTitle = document.getElementById("modalTitle");
    const taskForm = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const deadlineInput = document.getElementById("deadlineInput");
    const priorityInput = document.getElementById("priorityInput");
    const descriptionInput = document.getElementById("descriptionInput");
    const submitBtn = document.getElementById("submitBtn");
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    const taskList = document.getElementById("taskList");
    const toastContainer = document.getElementById("toastContainer");
    const activeTab = document.getElementById("activeTab");
    const historyTab = document.getElementById("historyTab");
    const clearHistoryBtn = document.getElementById("clearHistoryBtn");

    const totalCount = document.getElementById("totalCount");
    const activeCount = document.getElementById("activeCount");
    const completedCount = document.getElementById("completedCount");

    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
    let currentTab = "active";
    let editingTaskId = null;

    function saveTasks() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function formatDate(date) {
      if (!date) return "не вказано";

      return new Date(date).toLocaleDateString("uk-UA", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function getDeadlineInfo(deadline) {
      if (!deadline) {
        return {
          className: "safe",
          level: "no-deadline",
          text: "Дедлайн не встановлено"
        };
      }

      const now = new Date();
      const deadlineDate = new Date(deadline);
      const difference = deadlineDate - now;
      const oneDay = 24 * 60 * 60 * 1000;
      const oneWeek = 7 * oneDay;
      const twoWeeks = 14 * oneDay;

      if (difference < 0) {
        return {
          className: "overdue",
          level: "overdue",
          text: "Термін виконання минув"
        };
      }

      if (difference <= oneDay) {
        const hours = Math.ceil(difference / (60 * 60 * 1000));
        return {
          className: "overdue",
          level: "one-day",
          text: `Залишився 1 день або менше (${hours} год.)`
        };
      }

      if (difference <= oneWeek) {
        const days = Math.ceil(difference / oneDay);
        return {
          className: "warning",
          level: "one-week",
          text: `Залишився тиждень або менше (${days} дн.)`
        };
      }

      if (difference <= twoWeeks) {
        const days = Math.ceil(difference / oneDay);
        return {
          className: "safe",
          level: "two-weeks",
          text: `До дедлайну залишилось менше 2 тижнів (${days} дн.)`
        };
      }

      const days = Math.ceil(difference / oneDay);
      return {
        className: "safe",
        level: "more-than-two-weeks",
        text: `Часу достатньо (${days} дн.)`
      };
    }

    function showToast(title, message) {
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.innerHTML = `
        <div class="toast-title">${title}</div>
        <div>${message}</div>
      `;

      toastContainer.appendChild(toast);

      setTimeout(function() {
        toast.remove();
      }, 5000);
    }

    function getDeadlineNotificationText(level) {
      if (level === "two-weeks") return "До кінця залишилося менше двох тижнів";
      if (level === "one-week") return "До кінця залишився тиждень або менше";
      if (level === "one-day") return "До кінця залишився один день або менше";
      if (level === "overdue") return "Термін виконання завдання минув";
      return null;
    }

    function checkDeadlineNotifications() {
      let changed = false;

      tasks = tasks.map(function(task) {
        if (task.completed || !task.deadline) {
          return task;
        }

        const deadlineInfo = getDeadlineInfo(task.deadline);

        if (task.lastDeadlineLevel === undefined) {
          changed = true;
          return {
            ...task,
            lastDeadlineLevel: deadlineInfo.level
          };
        }

        if (task.lastDeadlineLevel !== deadlineInfo.level) {
          const message = getDeadlineNotificationText(deadlineInfo.level);

          if (message) {
            showToast(task.text, message);
          }

          changed = true;
          return {
            ...task,
            lastDeadlineLevel: deadlineInfo.level
          };
        }

        return task;
      });

      if (changed) {
        saveTasks();
      }
    }

    function updateStats() {
      const activeTasks = tasks.filter(function(task) {
        return !task.completed;
      });

      const completedTasks = tasks.filter(function(task) {
        return task.completed;
      });

      totalCount.textContent = tasks.length;
      activeCount.textContent = activeTasks.length;
      completedCount.textContent = completedTasks.length;
    }

    function renderTasks() {
      taskList.innerHTML = "";

      const filteredTasks = tasks.filter(function(task) {
        if (currentTab === "active") {
          return !task.completed;
        }
        return task.completed;
      });

      if (filteredTasks.length === 0) {
        const emptyMessage = document.createElement("li");
        emptyMessage.className = "empty";
        emptyMessage.textContent = currentTab === "active"
          ? "Активних завдань поки немає"
          : "Історія виконаних завдань порожня";
        taskList.appendChild(emptyMessage);
      }

      filteredTasks.forEach(function(task) {
        const deadlineInfo = getDeadlineInfo(task.deadline);

        const li = document.createElement("li");
        li.className = task.completed ? "task completed" : "task " + deadlineInfo.className;

        const taskInfo = document.createElement("div");
        taskInfo.className = "task-info";

        const title = document.createElement("div");
        title.className = "task-title";
        title.textContent = task.text;

        const date = document.createElement("div");
        date.className = "task-date";

        if (task.completed) {
          date.textContent = "Створено: " + formatDate(task.createdAt) + " | Виконано: " + formatDate(task.completedAt);
        } else {
          date.textContent = "Створено: " + formatDate(task.createdAt);
        }

        const deadline = document.createElement("div");
        deadline.className = "task-deadline";
        deadline.textContent = "Дедлайн: " + formatDate(task.deadline);

        const priority = document.createElement("div");
        priority.className = "task-priority";
        priority.innerHTML = "<strong>Важливість:</strong> " + (task.priority || "Звичайна");

        const description = document.createElement("div");
        description.className = "task-description";
        description.textContent = task.description ? "Опис: " + task.description : "";

        const status = document.createElement("div");
        status.className = "task-status";
        status.innerHTML = "<strong>Стан:</strong> " + (task.completed ? "Завдання виконано" : deadlineInfo.text);

        taskInfo.appendChild(title);
        taskInfo.appendChild(date);
        taskInfo.appendChild(deadline);
        taskInfo.appendChild(priority);
        if (task.description) taskInfo.appendChild(description);
        taskInfo.appendChild(status);

        const actions = document.createElement("div");
        actions.className = "task-actions";

        if (!task.completed) {
          const completeBtn = document.createElement("button");
          completeBtn.className = "complete-btn";
          completeBtn.textContent = "Виконано";
          completeBtn.onclick = function() {
            completeTask(task.id);
          };
          actions.appendChild(completeBtn);

          const editBtn = document.createElement("button");
          editBtn.className = "edit-btn";
          editBtn.textContent = "Редагувати";
          editBtn.onclick = function() {
            startEditTask(task.id);
          };
          actions.appendChild(editBtn);
        } else {
          const restoreBtn = document.createElement("button");
          restoreBtn.className = "restore-btn";
          restoreBtn.textContent = "Повернути";
          restoreBtn.onclick = function() {
            restoreTask(task.id);
          };
          actions.appendChild(restoreBtn);
        }

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "Видалити";
        deleteBtn.onclick = function() {
          deleteTask(task.id);
        };
        actions.appendChild(deleteBtn);

        li.appendChild(taskInfo);
        li.appendChild(actions);
        taskList.appendChild(li);
      });

      clearHistoryBtn.classList.toggle(
        "visible",
        currentTab === "history" && tasks.some(function(task) {
          return task.completed;
        })
      );

      updateStats();
    }

    function openModal(mode) {
      taskModal.classList.add("visible");
      modalTitle.textContent = mode === "edit" ? "Редагування завдання" : "Нове завдання";
      submitBtn.textContent = mode === "edit" ? "Зберегти" : "Додати";
      setTimeout(function() {
        taskInput.focus();
      }, 100);
    }

    function closeModal() {
      taskModal.classList.remove("visible");
      resetForm();
    }

    function resetForm() {
      editingTaskId = null;
      taskInput.value = "";
      deadlineInput.value = "";
      priorityInput.value = "Звичайна";
      descriptionInput.value = "";
      modalTitle.textContent = "Нове завдання";
      submitBtn.textContent = "Додати";
    }

    function addTask(text, deadline, priority, description) {
      const newTask = {
        id: Date.now(),
        text: text,
        completed: false,
        createdAt: new Date().toISOString(),
        deadline: deadline || null,
        priority: priority || "Звичайна",
        description: description || "",
        lastDeadlineLevel: deadline ? getDeadlineInfo(deadline).level : "no-deadline",
        completedAt: null
      };

      tasks.push(newTask);
      saveTasks();
      renderTasks();
      showToast("Завдання створено", text);
    }

    function updateTask(id, text, deadline, priority, description) {
      tasks = tasks.map(function(task) {
        if (task.id === id) {
          return {
            ...task,
            text: text,
            deadline: deadline || null,
            priority: priority || "Звичайна",
            description: description || "",
            lastDeadlineLevel: deadline ? getDeadlineInfo(deadline).level : "no-deadline"
          };
        }
        return task;
      });

      saveTasks();
      renderTasks();
      showToast("Завдання оновлено", text);
    }

    function completeTask(id) {
      tasks = tasks.map(function(task) {
        if (task.id === id) {
          return {
            ...task,
            completed: true,
            completedAt: new Date().toISOString()
          };
        }
        return task;
      });

      saveTasks();
      renderTasks();
    }

    function restoreTask(id) {
      tasks = tasks.map(function(task) {
        if (task.id === id) {
          return {
            ...task,
            completed: false,
            completedAt: null,
            lastDeadlineLevel: task.deadline ? getDeadlineInfo(task.deadline).level : "no-deadline"
          };
        }
        return task;
      });

      saveTasks();
      renderTasks();
    }

    function startEditTask(id) {
      const task = tasks.find(function(item) {
        return item.id === id;
      });

      if (!task) return;

      editingTaskId = id;
      taskInput.value = task.text;
      deadlineInput.value = task.deadline ? task.deadline.slice(0, 16) : "";
      priorityInput.value = task.priority || "Звичайна";
      descriptionInput.value = task.description || "";
      openModal("edit");
    }

    function deleteTask(id) {
      tasks = tasks.filter(function(task) {
        return task.id !== id;
      });

      saveTasks();
      renderTasks();
    }

    function clearHistory() {
      tasks = tasks.filter(function(task) {
        return !task.completed;
      });

      saveTasks();
      renderTasks();
    }

    openCreateModalBtn.onclick = function() {
      resetForm();
      openModal("create");
    };

    taskForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const text = taskInput.value.trim();
      const deadline = deadlineInput.value;
      const priority = priorityInput.value;
      const description = descriptionInput.value.trim();

      if (text === "") {
        alert("Будь ласка, введіть текст завдання:");
        return;
      }

      if (editingTaskId === null) {
        addTask(text, deadline, priority, description);
      } else {
        updateTask(editingTaskId, text, deadline, priority, description);
      }

      closeModal();
    });

    cancelEditBtn.onclick = function() {
      closeModal();
    };

    taskModal.addEventListener("click", function(event) {
      if (event.target === taskModal) {
        closeModal();
      }
    });

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape" && taskModal.classList.contains("visible")) {
        closeModal();
      }
    });

    activeTab.addEventListener("click", function() {
      currentTab = "active";
      activeTab.classList.add("active");
      historyTab.classList.remove("active");
      clearHistoryBtn.classList.remove("visible");
      renderTasks();
    });

    historyTab.addEventListener("click", function() {
      currentTab = "history";
      historyTab.classList.add("active");
      activeTab.classList.remove("active");
      renderTasks();
    });

    clearHistoryBtn.onclick = function() {
      clearHistory();
    };

    checkDeadlineNotifications();
    renderTasks();

    setInterval(function() {
      checkDeadlineNotifications();
      renderTasks();
    }, 60000);
  </script>
</body>
</html>
