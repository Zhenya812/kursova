<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Список справ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f2f4f8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 15px;
    }

    .app {
      width: 100%;
      max-width: 850px;
      background: #ffffff;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #222;
    }

    .form {
      display: grid;
      grid-template-columns: 1fr 230px auto;
      gap: 10px;
      margin-bottom: 20px;
    }

    .form input {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .form button,
    .task button,
    .tabs button,
    .clear-history {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .form button {
      background: #2d6cdf;
      color: white;
    }

    .form button:hover {
      background: #1f55b5;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tabs button {
      flex: 1;
      background: #e8ecf3;
      color: #222;
    }

    .tabs button.active {
      background: #2d6cdf;
      color: #fff;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
      color: #444;
      font-size: 14px;
    }

    .stat-box {
      flex: 1;
      background: #f5f7fb;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
    }

    .legend {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .legend-item {
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #ddd;
    }

    .legend-safe {
      background: #e9f8ee;
    }

    .legend-warning {
      background: #fff7d6;
    }

    .legend-overdue {
      background: #ffd6d6;
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task {
      border-radius: 12px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border: 2px solid transparent;
    }

    .task.safe {
      background: #e9f8ee;
      border-color: #95d5a6;
    }

    .task.warning {
      background: #fff7d6;
      border-color: #f0d36b;
    }

    .task.overdue {
      background: #ffd6d6;
      border-color: #e05252;
    }

    .task.completed {
      background: #eef1f5;
      border-color: #c6ccd6;
    }

    .task-info {
      flex: 1;
    }

    .task-title {
      font-size: 16px;
      color: #222;
      margin-bottom: 5px;
      word-break: break-word;
    }

    .task-date,
    .task-deadline,
    .task-status {
      font-size: 12px;
      color: #555;
      margin-top: 3px;
    }

    .task-status strong {
      color: #222;
    }

    .task-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .complete-btn {
      background: #28a745;
      color: #fff;
    }

    .edit-btn {
      background: #ffc107;
      color: #222;
    }

    .delete-btn {
      background: #dc3545;
      color: #fff;
    }

    .restore-btn {
      background: #17a2b8;
      color: #fff;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 25px 0;
    }

    .clear-history {
      margin-top: 20px;
      width: 100%;
      background: #dc3545;
      color: #fff;
      display: none;
    }

    .clear-history.visible {
      display: block;
    }

    .toast-container {
      position: fixed;
      right: 20px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1000;
    }

    .toast {
      min-width: 260px;
      max-width: 340px;
      background: #222;
      color: #fff;
      padding: 14px 16px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      font-size: 14px;
      animation: slideIn 0.3s ease;
    }

    .toast-title {
      font-weight: bold;
      margin-bottom: 4px;
    }

    @keyframes slideIn {
      from {
        transform: translateX(120%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @media (max-width: 750px) {
      .form {
        grid-template-columns: 1fr;
      }

      .legend {
        grid-template-columns: 1fr;
      }

      .task {
        flex-direction: column;
        align-items: stretch;
      }

      .task-actions {
        justify-content: flex-start;
      }

      .stats {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <div class="app">
    <h1>Список справ</h1>

    <form class="form" id="taskForm">
      <input type="text" id="taskInput" placeholder="Введіть нове завдання..." />
      <input type="datetime-local" id="deadlineInput" />
      <button type="submit">Додати</button>
    </form>

    <div class="tabs">
      <button class="active" id="activeTab" type="button">Активні завдання</button>
      <button id="historyTab" type="button">Історія виконаних</button>
    </div>

    <div class="stats">
      <div class="stat-box">Усього: <span id="totalCount">0</span></div>
      <div class="stat-box">Активні: <span id="activeCount">0</span></div>
      <div class="stat-box">Виконані: <span id="completedCount">0</span></div>
    </div>

    <div class="legend">
      <div class="legend-item legend-safe">Зелений: більше 2 тижнів</div>
      <div class="legend-item legend-warning">Жовтий: залишився тиждень або менше</div>
      <div class="legend-item legend-overdue">Червоний: залишився день або прострочено</div>
    </div>

    <ul class="task-list" id="taskList"></ul>

    <button class="clear-history" id="clearHistoryBtn" type="button">Очистити історію</button>
  </div>

  <script>
    const taskForm = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const deadlineInput = document.getElementById("deadlineInput");
    const taskList = document.getElementById("taskList");
    const toastContainer = document.getElementById("toastContainer");
    const activeTab = document.getElementById("activeTab");
    const historyTab = document.getElementById("historyTab");
    const clearHistoryBtn = document.getElementById("clearHistoryBtn");

    const totalCount = document.getElementById("totalCount");
    const activeCount = document.getElementById("activeCount");
    const completedCount = document.getElementById("completedCount");

    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
    let currentTab = "active";

    function saveTasks() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function formatDate(date) {
      if (!date) return "не вказано";

      return new Date(date).toLocaleDateString("uk-UA", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function getDeadlineInfo(deadline) {
      if (!deadline) {
        return {
          className: "safe",
          level: "no-deadline",
          text: "Дедлайн не встановлено"
        };
      }

      const now = new Date();
      const deadlineDate = new Date(deadline);
      const difference = deadlineDate - now;
      const oneDay = 24 * 60 * 60 * 1000;
      const oneWeek = 7 * oneDay;
      const twoWeeks = 14 * oneDay;

      if (difference < 0) {
        return {
          className: "overdue",
          level: "overdue",
          text: "Термін виконання минув"
        };
      }

      if (difference <= oneDay) {
        const hours = Math.ceil(difference / (60 * 60 * 1000));
        return {
          className: "overdue",
          level: "one-day",
          text: `Залишився 1 день або менше (${hours} год.)`
        };
      }

      if (difference <= oneWeek) {
        const days = Math.ceil(difference / oneDay);
        return {
          className: "warning",
          level: "one-week",
          text: `Залишився тиждень або менше (${days} дн.)`
        };
      }

      if (difference <= twoWeeks) {
        const days = Math.ceil(difference / oneDay);
        return {
          className: "safe",
          level: "two-weeks",
          text: `До дедлайну залишилось менше 2 тижнів (${days} дн.)`
        };
      }

      const days = Math.ceil(difference / oneDay);
      return {
        className: "safe",
        level: "more-than-two-weeks",
        text: `Часу достатньо (${days} дн.)`
      };
    }

    function showToast(title, message) {
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.innerHTML = `
        <div class="toast-title">${title}</div>
        <div>${message}</div>
      `;

      toastContainer.appendChild(toast);

      setTimeout(function() {
        toast.remove();
      }, 5000);
    }

    function getDeadlineNotificationText(level) {
      if (level === "two-weeks") return "До кінця залишилося менше двох тижнів";
      if (level === "one-week") return "До кінця залишився тиждень або менше";
      if (level === "one-day") return "До кінця залишився один день або менше";
      if (level === "overdue") return "Термін виконання завдання минув";
      return null;
    }

    function checkDeadlineNotifications() {
      let changed = false;

      tasks = tasks.map(function(task) {
        if (task.completed || !task.deadline) {
          return task;
        }

        const deadlineInfo = getDeadlineInfo(task.deadline);

        if (task.lastDeadlineLevel === undefined) {
          task.lastDeadlineLevel = deadlineInfo.level;
          changed = true;
          return task;
        }

        if (task.lastDeadlineLevel !== deadlineInfo.level) {
          const message = getDeadlineNotificationText(deadlineInfo.level);

          if (message) {
            showToast(task.text, message);
          }

          return {
            ...task,
            lastDeadlineLevel: deadlineInfo.level
          };
        }

        return task;
      });

      if (changed) {
        saveTasks();
      }
    }

    function updateStats() {
      const activeTasks = tasks.filter(function(task) {
        return !task.completed;
      });

      const completedTasks = tasks.filter(function(task) {
        return task.completed;
      });

      totalCount.textContent = tasks.length;
      activeCount.textContent = activeTasks.length;
      completedCount.textContent = completedTasks.length;
    }

    function renderTasks() {
      taskList.innerHTML = "";

      const filteredTasks = tasks.filter(function(task) {
        if (currentTab === "active") {
          return !task.completed;
        }
        return task.completed;
      });

      if (filteredTasks.length === 0) {
        const emptyMessage = document.createElement("li");
        emptyMessage.className = "empty";
        emptyMessage.textContent = currentTab === "active"
          ? "Активних завдань поки немає"
          : "Історія виконаних завдань порожня";
        taskList.appendChild(emptyMessage);
      }

      filteredTasks.forEach(function(task) {
        const deadlineInfo = getDeadlineInfo(task.deadline);

        const li = document.createElement("li");
        li.className = task.completed ? "task completed" : "task " + deadlineInfo.className;

        const taskInfo = document.createElement("div");
        taskInfo.className = "task-info";

        const title = document.createElement("div");
        title.className = "task-title";
        title.textContent = task.text;

        const date = document.createElement("div");
        date.className = "task-date";

        if (task.completed) {
          date.textContent = "Створено: " + formatDate(task.createdAt) + " | Виконано: " + formatDate(task.completedAt);
        } else {
          date.textContent = "Створено: " + formatDate(task.createdAt);
        }

        const deadline = document.createElement("div");
        deadline.className = "task-deadline";
        deadline.textContent = "Дедлайн: " + formatDate(task.deadline);

        const status = document.createElement("div");
        status.className = "task-status";
        status.innerHTML = "<strong>Стан:</strong> " + (task.completed ? "Завдання виконано" : deadlineInfo.text);

        taskInfo.appendChild(title);
        taskInfo.appendChild(date);
        taskInfo.appendChild(deadline);
        taskInfo.appendChild(status);

        const actions = document.createElement("div");
        actions.className = "task-actions";

        if (!task.completed) {
          const completeBtn = document.createElement("button");
          completeBtn.className = "complete-btn";
          completeBtn.textContent = "Виконано";
          completeBtn.addEventListener("click", function() {
            completeTask(task.id);
          });
          actions.appendChild(completeBtn);

          const editBtn = document.createElement("button");
          editBtn.className = "edit-btn";
          editBtn.textContent = "Редагувати";
          editBtn.addEventListener("click", function() {
            editTask(task.id);
          });
          actions.appendChild(editBtn);
        } else {
          const restoreBtn = document.createElement("button");
          restoreBtn.className = "restore-btn";
          restoreBtn.textContent = "Повернути";
          restoreBtn.addEventListener("click", function() {
            restoreTask(task.id);
          });
          actions.appendChild(restoreBtn);
        }

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "Видалити";
        deleteBtn.addEventListener("click", function() {
          deleteTask(task.id);
        });
        actions.appendChild(deleteBtn);

        li.appendChild(taskInfo);
        li.appendChild(actions);
        taskList.appendChild(li);
      });

      clearHistoryBtn.classList.toggle(
        "visible",
        currentTab === "history" && tasks.some(function(task) {
          return task.completed;
        })
      );

      updateStats();
    }

    function addTask(text, deadline) {
      const newTask = {
        id: Date.now(),
        text: text,
        completed: false,
        createdAt: new Date().toISOString(),
        deadline: deadline || null,
        lastDeadlineLevel: deadline ? getDeadlineInfo(deadline).level : "no-deadline",
        completedAt: null
      };

      tasks.push(newTask);
      saveTasks();
      renderTasks();
    }

    function completeTask(id) {
      tasks = tasks.map(function(task) {
        if (task.id === id) {
          return {
            ...task,
            completed: true,
            completedAt: new Date().toISOString()
          };
        }
        return task;
      });

      saveTasks();
      renderTasks();
    }

    function restoreTask(id) {
      tasks = tasks.map(function(task) {
        if (task.id === id) {
          return {
            ...task,
            completed: false,
            completedAt: null,
            lastDeadlineLevel: task.deadline ? getDeadlineInfo(task.deadline).level : "no-deadline"
          };
        }
        return task;
      });

      saveTasks();
      renderTasks();
    }

    function editTask(id) {
      const task = tasks.find(function(task) {
        return task.id === id;
      });

      const newText = prompt("Введіть новий текст завдання:", task.text);

      if (newText === null || newText.trim() === "") {
        return;
      }

      const currentDeadline = task.deadline ? task.deadline.slice(0, 16).replace("T", " ") : "";
      const newDeadline = prompt(
        "Введіть новий дедлайн у форматі РРРР-ММ-ДД ГГ:ХХ або залиште порожнім:",
        currentDeadline
      );

      task.text = newText.trim();

      if (newDeadline !== null) {
        const normalizedDeadline = newDeadline.trim().replace(" ", "T");
        task.deadline = normalizedDeadline === "" ? null : normalizedDeadline;
        task.lastDeadlineLevel = task.deadline ? getDeadlineInfo(task.deadline).level : "no-deadline";
      }

      saveTasks();
      renderTasks();
    }

    function deleteTask(id) {
      const confirmDelete = confirm("Ви точно хочете видалити це завдання?");

      if (confirmDelete) {
        tasks = tasks.filter(function(task) {
          return task.id !== id;
        });
        saveTasks();
        renderTasks();
      }
    }

    function clearHistory() {
      const confirmClear = confirm("Ви точно хочете очистити всю історію виконаних завдань?");

      if (confirmClear) {
        tasks = tasks.filter(function(task) {
          return !task.completed;
        });
        saveTasks();
        renderTasks();
      }
    }

    taskForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const text = taskInput.value.trim();
      const deadline = deadlineInput.value;

      if (text === "") {
        alert("Будь ласка, введіть текст завдання");
        return;
      }

      addTask(text, deadline);
      taskInput.value = "";
      deadlineInput.value = "";
      taskInput.focus();
    });

    activeTab.addEventListener("click", function() {
      currentTab = "active";
      activeTab.classList.add("active");
      historyTab.classList.remove("active");
      renderTasks();
    });

    historyTab.addEventListener("click", function() {
      currentTab = "history";
      historyTab.classList.add("active");
      activeTab.classList.remove("active");
      renderTasks();
    });

    clearHistoryBtn.addEventListener("click", clearHistory);

    checkDeadlineNotifications();
    renderTasks();

    setInterval(function() {
      checkDeadlineNotifications();
      renderTasks();
    }, 60000);
  </script>
</body>
</html>
